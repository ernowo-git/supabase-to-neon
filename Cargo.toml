[package]
name = "supabase-to-neon"
version = "0.1.0-alpha.2"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "Inspect, plan, and rehearse a Supabase to Neon migration"
repository = "https://github.com/ernowo-git/supabase-to-neon"
readme = "README.md"

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.7", features = ["derive"] }
futures = "0.3"
object_store = { version = "=0.14.2", features = ["aws"] }
percent-encoding = "=2.3.2"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
tempfile = "=3.27.0"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "process", "io-util", "signal"] }
toml = "=0.9.8"
url = "=2.5.8"
uuid = { version = "=1.23.0", features = ["v4", "serde"] }

[dev-dependencies]

[profile.release]
lto = "thin"
strip = true
