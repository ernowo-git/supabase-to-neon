version = 1
schemas = ["public"]

[source]
project = "supabase-source-project-ref"
connection_env = "SOURCE_DATABASE_URL"

[target]
project = "neon-target-project-id"
connection_env = "TARGET_DATABASE_URL"

[[buckets]]
access = "private"

[buckets.source]
endpoint = "https://source-project.storage.supabase.co/storage/v1/s3"
region = "ap-southeast-1"
bucket = "documents"
access_key_env = "SOURCE_S3_ACCESS_KEY"
secret_key_env = "SOURCE_S3_SECRET_KEY"

[buckets.target]
endpoint = "https://replace-with-neon-storage-endpoint.example"
region = "ap-southeast-1"
bucket = "documents"
access_key_env = "TARGET_S3_ACCESS_KEY"
secret_key_env = "TARGET_S3_SECRET_KEY"
